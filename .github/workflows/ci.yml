name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: SQLMesh test
        working-directory: sqlmesh
        run: uv run --project .. sqlmesh test

      - name: SQLMesh plan
        working-directory: sqlmesh
        run: uv run --project .. sqlmesh plan --auto-apply --no-prompts

      - name: SQLMesh audit
        working-directory: sqlmesh
        run: uv run --project .. sqlmesh audit
