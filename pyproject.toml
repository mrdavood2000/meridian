[project]
name = "meridian"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.16",
    "dagster-sqlmesh>=0.22.0",
    "dagster-webserver>=1.13.16",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "sqlmesh[web]>=0.236.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
