[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

[project]
name = "meridian"
version = "0.1.0"
description = "A self-auditing view of how Amsterdam moves and breathes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "dagster>=1.13.14",
    "dagster-sqlmesh>=0.22.0",
    "dagster-webserver>=1.13.14",
    "duckdb>=1.5.4",
    "httpx>=0.28.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlmesh[web]>=0.236.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
